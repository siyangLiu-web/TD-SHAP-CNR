[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdshap-cnr"
version = "0.1.0"
authors = [
  { name="SyLucky LIU", email="syliucky02@gmail.com" },
]
description = "Time-Delay SHAP Causal Network Reconstruction Toolkit"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "shap>=0.40.0",
    "networkx>=2.6",
    "scipy>=1.7.0",
    "tqdm>=4.62.0"
]

[project.urls]
"Homepage" = "https://github.com/siyangLiu-web/TD-SHAP-CNR"
"Bug Tracker" = "https://github.com/siyangLiu-web/TD-SHAP-CNR/issues"